name: CI

# Build check: runs on every pull request and on pushes to main.
# Keeps `main` always-deployable — a PR can't merge with a broken build
# once this is set as a required status check (Settings → Branches).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (clean, from lockfile)
        run: npm ci

      - name: Build site
        run: npm run build
